packages:
  - "."
  - "apps/jarvis"
  - "apps/jarvis-next"

# pnpm build-script policy (pnpm 10+/11).
# The three `ws` native accelerators are optional — the JS fallback is used when
# they're absent, so we intentionally skip their build scripts. esbuild +
# protobufjs DO need their install scripts and pnpm builds them by default.
allowBuilds:
  bufferutil: false
  es5-ext: false
  utf-8-validate: false
  esbuild: true
  protobufjs: true
  sharp: false
  '@google/genai': set this to true or false
  better-sqlite3: set this to true or false
ignoredBuiltDependencies:
  - bufferutil
  - es5-ext
  - utf-8-validate
onlyBuiltDependencies:
  - esbuild
  - protobufjs
# pnpm 11's pre-run drift check was failing every `pnpm <script>` (test/lint/eval)
# while the optional builds sat "pending". tsc/vitest verify real correctness;
# this skips only pnpm's convenience pre-run check.
verifyDepsBeforeRun: false
