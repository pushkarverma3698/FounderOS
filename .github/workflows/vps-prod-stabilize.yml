name: VPS Prod Stabilize

# Deploy + operational fixes on the Hetzner production VPS.
# Use after QA fixes land on beta (or stable) before main promotion.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy to production"
        required: true
        default: "beta"
        type: string

concurrency:
  group: vps-prod-stabilize
  cancel-in-progress: false

jobs:
  stabilize:
    name: Deploy and stabilize prod VPS
    runs-on: ubuntu-latest
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Stabilize production over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "30m"
          script_stop: true
          envs: PROD_DOTENV,OPENROUTER_API_KEY,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos
            # Render production .env from secret (same as deploy.yml).
            if [ -n "${PROD_DOTENV:-}" ]; then
              umask 077
              printf '%s' "$PROD_DOTENV" | base64 -d > .env.tmp
              if grep -q '^DATABASE_URL=' .env.tmp; then
                mv .env.tmp .env
                chmod 600 .env
                echo "==> Rendered .env from PROD_DOTENV"
              else
                rm -f .env.tmp
                echo "!! PROD_DOTENV invalid — keeping existing .env" >&2
                exit 1
              fi
            fi
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              grep -v -E '^(AGENT_MODEL|OPENROUTER_API_KEY|AGENT_FALLBACK_MODELS)=' .env > .env.patched || true
              {
                printf '%s\n' 'AGENT_MODEL=openrouter:google/gemini-2.5-flash'
                printf '%s\n' 'AGENT_FALLBACK_MODELS=anthropic:claude-haiku-4-5'
                printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
              } >> .env.patched
              mv .env.patched .env
              chmod 600 .env
            fi
            git fetch --quiet origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd
            chmod +x scripts/vps-prod-stabilize.sh
            DEPLOY_BRANCH="$DEPLOY_BRANCH" bash scripts/vps-prod-stabilize.sh
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
