name: VPS Prod Stabilize

# Deploy + operational fixes on the Hetzner production VPS.
# Use after QA fixes land on beta (or stable) before main promotion.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy to production"
        required: true
        default: "beta"
        type: string

concurrency:
  group: vps-prod-stabilize
  cancel-in-progress: false

jobs:
  stabilize:
    name: Deploy and stabilize prod VPS
    runs-on: ubuntu-latest
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
    steps:
      - name: Stabilize production over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "30m"
          script_stop: true
          envs: PROD_DOTENV,OPENROUTER_API_KEY,LINKEDIN_ACCESS_TOKEN,LINKEDIN_AUTHOR_URN,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos
            git fetch --quiet origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd
            chmod +x scripts/apply-prod-env-overrides.sh scripts/vps-prod-stabilize.sh
            bash scripts/apply-prod-env-overrides.sh
            DEPLOY_BRANCH="$DEPLOY_BRANCH" bash scripts/vps-prod-stabilize.sh
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}
