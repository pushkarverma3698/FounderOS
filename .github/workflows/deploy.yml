name: Deploy

# Auto-deploy to the production VPS on every push to main, but ONLY after CI
# (.github/workflows/ci.yml) succeeds for that same commit. The workflow_run
# gate prevents shipping a commit whose tests/lint are red.
#
# main IS production (ADR-021 / single-tenant): there is no separate `production`
# branch. Merging to main → CI runs → on success this deploy fires.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual escape hatch from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Belt-and-suspenders: never SSH-deploy without a green compile. workflow_dispatch
  # can skip CI; workflow_run already gated CI but we re-verify build here.
  preflight:
    name: Pre-deploy compile check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:all

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [preflight]
    # For workflow_run: only deploy if CI passed. For manual: always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # PROD_DOTENV holds the FULL production .env, base64-encoded (single line, so
    # it survives transport through the SSH env without newline corruption).
    # Edit prod env without SSH:  base64 -w0 .env.production | gh secret set PROD_DOTENV
    # (or paste the base64 blob into Settings → Secrets → PROD_DOTENV).
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      # MCP client bridge (ADR-041). Bridge is OFF by default (MCP_BRIDGE_ENABLED=false
      # in PROD_DOTENV). To enable: set MCP_BRIDGE_ENABLED=true in PROD_DOTENV and
      # add SLACK_BOT_TOKEN + SLACK_TEAM_ID as GitHub repo secrets.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # Fail the job if the remote script fails.
          script_stop: true
          command_timeout: "10m"
          # Forward secrets into the remote shell.
          envs: PROD_DOTENV,OPENROUTER_API_KEY,LINKEDIN_ACCESS_TOKEN,LINKEDIN_AUTHOR_URN,SLACK_BOT_TOKEN,SLACK_TEAM_ID
          script: |
            set -euo pipefail
            cd /opt/founderos
            # Render the production .env from the secret (atomic, 0600). Only when
            # the secret is present — never clobber a good .env with an empty one.
            if [ -n "${PROD_DOTENV:-}" ]; then
              umask 077
              printf '%s' "$PROD_DOTENV" | base64 -d > .env.tmp
              # Sanity: a valid .env must contain DATABASE_URL, else abort (keep old).
              if grep -q '^DATABASE_URL=' .env.tmp; then
                mv .env.tmp .env
                chmod 600 .env
                echo "==> Rendered /opt/founderos/.env from PROD_DOTENV secret"
              else
                rm -f .env.tmp
                echo "!! PROD_DOTENV decoded but has no DATABASE_URL — keeping existing .env" >&2
                exit 1
              fi
            else
              echo "==> PROD_DOTENV not set; using the .env already on the box"
            fi
            # Pin the production model. Gemini 2.5 Flash is the documented prod model.
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              grep -v -E '^(AGENT_MODEL|OPENROUTER_API_KEY|AGENT_FALLBACK_MODELS)=' .env > .env.patched || true
              {
                printf '%s\n' 'AGENT_MODEL=openrouter:google/gemini-2.5-flash'
                printf '%s\n' 'AGENT_FALLBACK_MODELS=anthropic:claude-haiku-4-5'
                printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
              } >> .env.patched
              mv .env.patched .env
              chmod 600 .env
              echo "==> Patched .env: AGENT_MODEL=openrouter:google/gemini-2.5-flash"
            fi
            # MCP bridge Slack secrets — append only when the secret is set.
            # These are NOT in PROD_DOTENV (they rotate independently); forwarded as
            # separate GitHub secrets so they can be updated without re-encoding the
            # entire PROD_DOTENV blob.
            if [ -n "${SLACK_BOT_TOKEN:-}" ]; then
              grep -v -E '^(SLACK_BOT_TOKEN|SLACK_TEAM_ID)=' .env > .env.patched || true
              {
                printf 'SLACK_BOT_TOKEN=%s\n' "$SLACK_BOT_TOKEN"
                [ -n "${SLACK_TEAM_ID:-}" ] && printf 'SLACK_TEAM_ID=%s\n' "$SLACK_TEAM_ID"
              } >> .env.patched
              mv .env.patched .env
              chmod 600 .env
              echo "==> Patched .env: SLACK_BOT_TOKEN + SLACK_TEAM_ID set"
            fi
            # Fix git permission drift (e.g. prior verify left root-owned refs).
            if [ -d .git/refs/heads/cursor ]; then
              rm -rf .git/refs/heads/cursor 2>/dev/null || true
            fi
            find .git -name '*.lock' -delete 2>/dev/null || true
            git fetch --quiet origin main
            git checkout --force --detach origin/main 2>/dev/null || git checkout -B main origin/main
            chmod +x scripts/apply-prod-env-overrides.sh deploy/deploy.sh 2>/dev/null || true
            bash scripts/apply-prod-env-overrides.sh
            ./deploy/deploy.sh
