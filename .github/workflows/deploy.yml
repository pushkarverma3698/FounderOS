name: Deploy

# Auto-deploy to production after CI passes on main. CI already runs lint+build;
# deploy.sh re-verifies on the VPS before restart.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: "10m"
          envs: PROD_DOTENV,GOOGLE_GENERATIVE_AI_API_KEY,OPENROUTER_API_KEY,LINKEDIN_ACCESS_TOKEN,LINKEDIN_AUTHOR_URN,SLACK_BOT_TOKEN,SLACK_TEAM_ID
          script: |
            set -euo pipefail
            cd /opt/founderos
            if [ -d .git/refs/heads/cursor ]; then
              rm -rf .git/refs/heads/cursor 2>/dev/null || true
            fi
            find .git -name '*.lock' -delete 2>/dev/null || true
            git fetch --quiet origin main
            git checkout --force --detach origin/main 2>/dev/null || git checkout -B main origin/main
            chmod +x scripts/apply-prod-env-overrides.sh deploy/deploy.sh 2>/dev/null || true
            bash scripts/apply-prod-env-overrides.sh
            ./deploy/deploy.sh
