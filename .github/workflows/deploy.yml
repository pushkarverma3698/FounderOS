name: Deploy

# Auto-deploy to the production VPS on every push to main, but ONLY after CI
# (.github/workflows/ci.yml) succeeds for that same commit. The workflow_run
# gate prevents shipping a commit whose tests/lint are red.
#
# main IS production (ADR-021 / single-tenant): there is no separate `production`
# branch. Merging to main → CI runs → on success this deploy fires.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual escape hatch from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Belt-and-suspenders: never SSH-deploy without a green compile. workflow_dispatch
  # can skip CI; workflow_run already gated CI but we re-verify build here.
  preflight:
    name: Pre-deploy compile check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:all

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [preflight]
    # For workflow_run: only deploy if CI passed. For manual: always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # PROD_DOTENV holds the FULL production .env, base64-encoded (single line, so
    # it survives transport through the SSH env without newline corruption).
    # Edit prod env without SSH:  base64 -w0 .env.production | gh secret set PROD_DOTENV
    # (or paste the base64 blob into Settings → Secrets → PROD_DOTENV).
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      # MCP client bridge (ADR-041). Bridge is OFF by default (MCP_BRIDGE_ENABLED=false
      # in PROD_DOTENV). To enable: set MCP_BRIDGE_ENABLED=true in PROD_DOTENV and
      # add SLACK_BOT_TOKEN + SLACK_TEAM_ID as GitHub repo secrets.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # Fail the job if the remote script fails.
          script_stop: true
          command_timeout: "10m"
          # Forward secrets into the remote shell.
          envs: PROD_DOTENV,GOOGLE_GENERATIVE_AI_API_KEY,OPENROUTER_API_KEY,LINKEDIN_ACCESS_TOKEN,LINKEDIN_AUTHOR_URN,SLACK_BOT_TOKEN,SLACK_TEAM_ID
          script: |
            set -euo pipefail
            cd /opt/founderos
            # Fix git permission drift (e.g. prior verify left root-owned refs).
            if [ -d .git/refs/heads/cursor ]; then
              rm -rf .git/refs/heads/cursor 2>/dev/null || true
            fi
            find .git -name '*.lock' -delete 2>/dev/null || true
            git fetch --quiet origin main
            git checkout --force --detach origin/main 2>/dev/null || git checkout -B main origin/main
            chmod +x scripts/apply-prod-env-overrides.sh deploy/deploy.sh 2>/dev/null || true
            # scripts/apply-prod-env-overrides.sh is THE single renderer of .env:
            # PROD_DOTENV render, on-box preservation (TELEGRAM_TESTER_SESSION +
            # provisioned keys), model pin, and per-secret patches all live there.
            # 2026-07-09: an inline second render here clobbered the preservation —
            # never duplicate that logic in this workflow again.
            bash scripts/apply-prod-env-overrides.sh
            ./deploy/deploy.sh
