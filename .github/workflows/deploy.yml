name: Deploy

# Auto-deploy to the production VPS on every push to main, but ONLY after CI
# (.github/workflows/ci.yml) succeeds for that same commit. The workflow_run
# gate prevents shipping a commit whose tests/lint are red.
#
# main IS production (ADR-021 / single-tenant): there is no separate `production`
# branch. Merging to main → CI runs → on success this deploy fires.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual escape hatch from the Actions tab.
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # For workflow_run: only deploy if CI passed. For manual: always allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # PROD_DOTENV holds the FULL production .env, base64-encoded (single line, so
    # it survives transport through the SSH env without newline corruption).
    # Edit prod env without SSH:  base64 -w0 .env.production | gh secret set PROD_DOTENV
    # (or paste the base64 blob into Settings → Secrets → PROD_DOTENV).
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          # Fail the job if the remote script fails.
          script_stop: true
          command_timeout: "10m"
          # Forward secrets into the remote shell.
          envs: PROD_DOTENV,OPENROUTER_API_KEY
          script: |
            set -euo pipefail
            cd /opt/founderos
            # Render the production .env from the secret (atomic, 0600). Only when
            # the secret is present — never clobber a good .env with an empty one.
            if [ -n "${PROD_DOTENV:-}" ]; then
              umask 077
              printf '%s' "$PROD_DOTENV" | base64 -d > .env.tmp
              # Sanity: a valid .env must contain DATABASE_URL, else abort (keep old).
              if grep -q '^DATABASE_URL=' .env.tmp; then
                mv .env.tmp .env
                chmod 600 .env
                echo "==> Rendered /opt/founderos/.env from PROD_DOTENV secret"
              else
                rm -f .env.tmp
                echo "!! PROD_DOTENV decoded but has no DATABASE_URL — keeping existing .env" >&2
                exit 1
              fi
            else
              echo "==> PROD_DOTENV not set; using the .env already on the box"
            fi
            # While Gemini credits are depleted, prefer OpenRouter when the key is
            # available in GitHub secrets — avoids re-encoding the full PROD_DOTENV blob.
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              grep -v -E '^(AGENT_MODEL|OPENROUTER_API_KEY|AGENT_FALLBACK_MODELS)=' .env > .env.patched || true
              {
                printf '%s\n' 'AGENT_MODEL=openrouter:openai/gpt-4o-mini'
                printf '%s\n' 'AGENT_FALLBACK_MODELS=anthropic:claude-haiku-4-5,google-genai:gemini-2.0-flash'
                printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
              } >> .env.patched
              mv .env.patched .env
              chmod 600 .env
              echo "==> Patched .env: AGENT_MODEL=openrouter:openai/gpt-4o-mini"
            fi
            ./deploy/deploy.sh
