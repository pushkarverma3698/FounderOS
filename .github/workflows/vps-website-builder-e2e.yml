name: VPS Website Builder E2E

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to verify on VPS"
        required: true
        default: "main"
        type: string

concurrency:
  group: vps-website-builder-e2e
  cancel-in-progress: false

jobs:
  verify:
    name: Website builder E2E on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
    steps:
      - name: Run E2E verify + nginx/env fixes on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "40m"
          script_stop: true
          envs: VPS_SUDO_PASSWORD
          script: |
            set -euo pipefail
            BRANCH="${{ inputs.branch }}"
            cd /opt/founderos
            git fetch --quiet origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fd
            chmod +x scripts/vps-website-builder-e2e-verify.sh scripts/vps-website-builder-smoke.sh scripts/vps-proof-nginx-setup.sh 2>/dev/null || true

            # Ensure STATIC_SITE_PUBLIC_BASE_URL (idempotent)
            if ! grep -q '^STATIC_SITE_PUBLIC_BASE_URL=' .env 2>/dev/null; then
              echo 'STATIC_SITE_PUBLIC_BASE_URL=http://YOUR_VPS_IP' >> .env
              echo "==> Added STATIC_SITE_PUBLIC_BASE_URL to .env"
            fi

            # nginx for static hosting
            if ! command -v nginx >/dev/null 2>&1; then
              if [ -n "${VPS_SUDO_PASSWORD:-}" ]; then
                echo "$VPS_SUDO_PASSWORD" | sudo -S apt-get update -qq
                echo "$VPS_SUDO_PASSWORD" | sudo -S apt-get install -y -qq nginx
              else
                sudo -n apt-get update -qq && sudo -n apt-get install -y -qq nginx || echo "!! nginx install skipped"
              fi
            fi
            if command -v nginx >/dev/null 2>&1; then
              bash scripts/vps-proof-nginx-setup.sh || true
            fi

            # Fast prod smoke (evidence artifact)
            bash scripts/vps-website-builder-smoke.sh 2>&1 | tee /tmp/vps-wb-smoke-latest.log
            tail -50 /tmp/vps-wb-smoke-latest.log
