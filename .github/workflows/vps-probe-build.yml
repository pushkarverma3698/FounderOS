name: VPS Build Probe

on:
  workflow_dispatch:

concurrency:
  group: vps-build-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Cinematic build probe on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Run build probe on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "20m"
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/founderos
            git fetch --quiet origin main
            git checkout -B probe-build-verify origin/main
            pnpm install --frozen-lockfile --silent
            node --env-file=.env --import tsx/esm scripts/probe-cinematic-build.ts 2>&1 | tee /tmp/probe-cinematic-build.log
            echo "==> Log tail:"
            tail -80 /tmp/probe-cinematic-build.log
