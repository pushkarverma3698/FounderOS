name: Branch policy

# SIMPLIFIED 2026-07-01 — the stable → beta → main promotion ladder was removed.
# It added friction (three PRs to ship one change) without buying safety that CI +
# branch protection don't already provide. The new model is flat:
#
#     any work branch  →  main  (PR + green CI)  →  auto-deploy
#
# This job is intentionally a no-op that always succeeds. It is kept (same name,
# "Verify PR base/head branches") so that if it is still configured as a REQUIRED
# status check in branch protection, PRs are not left waiting on a check that no
# longer runs. Delete this file once the required-check entry is removed in
# Settings → Branches. See docs/process/BRANCH-MODEL.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  promotion-ladder:
    name: Verify PR base/head branches
    runs-on: ubuntu-latest
    steps:
      - name: Flat branch model — any branch may target main
        run: |
          echo "Branch ladder removed (2026-07-01). Flow: work branch → main → deploy."
          echo "Merge safety is enforced by CI + branch protection, not by this check."
          exit 0
