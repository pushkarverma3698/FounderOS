name: Branch policy

# Enforces the stable → beta → main promotion ladder in CI so agents cannot
# accidentally open feat/* → main and deploy broken code to production.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  promotion-ladder:
    name: Verify PR base/head branches
    runs-on: ubuntu-latest
    # Closed PRs (e.g. a mistaken beta→main) must not pollute checks on the head branch.
    if: github.event.pull_request.state == 'open'
    steps:
      - name: main only accepts stable
        if: github.base_ref == 'main' && github.head_ref != 'stable'
        run: |
          echo "::error::PRs to main must come from branch 'stable' only."
          echo "Head branch '${{ github.head_ref }}' cannot merge to main."
          echo "Fix: retarget PR to 'beta' (gh pr edit <n> --base beta) or open a promotion PR stable→main."
          echo "Flow: feat/*|cursor/* → beta → stable → main"
          echo "See docs/process/BRANCH-MODEL.md and AGENTS.md"
          exit 1

      - name: stable only accepts beta
        if: github.base_ref == 'stable' && github.head_ref != 'beta'
        run: |
          echo "::error::PRs to stable must come from branch 'beta' only."
          echo "When beta is validated, open PR: beta → stable"
          exit 1

      - name: beta accepts feature branches only
        if: >-
          github.base_ref == 'beta' &&
          !startsWith(github.head_ref, 'feat/') &&
          !startsWith(github.head_ref, 'fix/') &&
          !startsWith(github.head_ref, 'chore/') &&
          !startsWith(github.head_ref, 'cursor/') &&
          !startsWith(github.head_ref, 'claude/')
        run: |
          echo "::error::PRs to beta must come from feat/*, fix/*, chore/*, cursor/*, or claude/* branches."
          exit 1
