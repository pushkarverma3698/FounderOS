name: Live check

# Optional milestone gate — real API key + Postgres. Run manually before a big
# release; never blocks merge or deploy.
on:
  workflow_dispatch:

jobs:
  live:
    name: Integration + eval (live)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      AGENT_MODEL: "google-genai:gemini-2.5-flash"
      AGENT_FALLBACK_MODELS: "openrouter:meta-llama/llama-3.3-70b-instruct:free,openrouter:qwen/qwen3-next-80b-a3b-instruct:free"
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      TELEGRAM_BOT_TOKEN: "ci:placeholder"
      TELEGRAM_CHAT_ID: "000000000"
    steps:
      - name: Require API key
        if: env.GOOGLE_GENERATIVE_AI_API_KEY == ''
        run: |
          echo "GOOGLE_GENERATIVE_AI_API_KEY secret is not set."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: touch .env
      - name: Migrate DB
        run: node --env-file=.env --import tsx/esm scripts/setup-db.ts
      - run: pnpm test:integration
      - run: pnpm eval
      - run: pnpm proof:scoreboard
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-reports
          path: |
            eval-report.md
            docs/PROOF.md
          if-no-files-found: ignore
