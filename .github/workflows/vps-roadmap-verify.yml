name: VPS Roadmap Verify

# Runs scripts/vps-roadmap-verify.sh on the Hetzner box via SSH (deploy secrets).
# Tests the merged P0–P3 roadmap work against prod: migration (agent_assets),
# checkpoint-sweep dry report, per-department cost, optional creative image gen,
# and a creative-enabled routing eval. Does NOT restart founderos.service.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to verify on VPS"
        required: true
        default: "main"
        type: string
      image:
        description: "Make a real ~$0.01 Nano Banana draft image call"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: vps-roadmap-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Roadmap verify on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Run roadmap verification on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "30m"
          script_stop: true
          envs: VERIFY_BRANCH,IMAGE_FLAG
          script: |
            set -euo pipefail
            export VERIFY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos
            find .git -name '*.lock' -delete 2>/dev/null || true
            git fetch --quiet origin "$VERIFY_BRANCH"
            git reset --hard "origin/$VERIFY_BRANCH"
            git clean -fd || true
            chmod +x scripts/vps-roadmap-verify.sh 2>/dev/null || true
            if [ "${{ inputs.image }}" = "true" ]; then
              VERIFY_BRANCH="$VERIFY_BRANCH" bash scripts/vps-roadmap-verify.sh --image
            else
              VERIFY_BRANCH="$VERIFY_BRANCH" bash scripts/vps-roadmap-verify.sh
            fi
        env:
          VERIFY_BRANCH: ${{ inputs.branch }}
