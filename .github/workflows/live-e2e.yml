name: Live E2E

# Full kernel proof + golden-set eval. Manual only — acceptance gate, not dev loop.
on:
  workflow_dispatch:

jobs:
  live-e2e:
    name: Live kernel proof + golden-set eval
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: founderos
          POSTGRES_PASSWORD: founderos
          POSTGRES_DB: founderos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U founderos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      AGENT_MODEL: "google-genai:gemini-2.5-flash"
      DATABASE_URL: "postgresql://founderos:founderos@localhost:5432/founderos"
      TELEGRAM_BOT_TOKEN: "ci:placeholder"
      TELEGRAM_CHAT_ID: "000000000"
      SCRAPE_BACKEND: "fetch"
      LOG_LEVEL: "warn"
    steps:
      - name: Require API key
        if: env.GOOGLE_GENERATIVE_AI_API_KEY == ''
        run: |
          echo "GOOGLE_GENERATIVE_AI_API_KEY secret is not set."
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: touch .env
      - name: Migrate DB
        run: node --env-file=.env --import tsx/esm scripts/setup-db.ts
      - name: Live kernel proof
        run: node --env-file=.env --import tsx/esm scripts/live-e2e-proof.ts
      - name: Live golden-set eval
        run: pnpm eval
      - name: Live cost ledger
        run: pnpm proof:costs
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-e2e-reports
          path: |
            eval-report.md
            docs/COSTS.md
          if-no-files-found: ignore
