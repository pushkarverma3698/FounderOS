name: VPS Verify

# Manual SSH verification on the Hetzner box using deploy secrets.
# Does NOT restart founderos.service or change the running branch unless
# VERIFY_BRANCH is merged to main and deploy runs separately.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to verify on VPS"
        required: true
        default: "feat/web-design-service-cb8b"
        type: string

concurrency:
  group: vps-verify
  cancel-in-progress: false

jobs:
  verify:
    name: SSH verify on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Run verification script on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "30m"
          script_stop: true
          envs: VERIFY_BRANCH
          script: |
            set -euo pipefail
            export VERIFY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos
            git fetch --quiet origin "$VERIFY_BRANCH"
            git checkout -B "verify-$VERIFY_BRANCH" "origin/$VERIFY_BRANCH"
            chmod +x scripts/vps-verify-web-design.sh
            VERIFY_BRANCH="$VERIFY_BRANCH" bash scripts/vps-verify-web-design.sh
        env:
          VERIFY_BRANCH: ${{ inputs.branch }}
