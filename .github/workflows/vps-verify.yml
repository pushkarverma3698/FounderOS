name: VPS Verify

# Manual SSH verification on the Hetzner box using deploy secrets.
# Does NOT restart founderos.service or change the running branch unless
# VERIFY_BRANCH is merged to main and deploy runs separately.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to verify on VPS"
        required: true
        default: "main"
        type: string
      live_only:
        description: "Skip tests — only run live showcase + HITL build verify"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: vps-verify
  cancel-in-progress: false

jobs:
  verify:
    name: SSH verify on VPS
    runs-on: ubuntu-latest
    steps:
      - name: Run verification script on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "30m"
          script_stop: true
          envs: VERIFY_BRANCH
          script: |
            set -euo pipefail
            export VERIFY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos
            git fetch --quiet origin "$VERIFY_BRANCH"
            git checkout -B "verify-$VERIFY_BRANCH" "origin/$VERIFY_BRANCH"
            chmod +x scripts/vps-verify-web-design.sh scripts/vps-live-showcase.sh
            if [ "${{ inputs.live_only }}" = "true" ]; then
              bash scripts/vps-verify-web-design.sh --live-only
            else
              VERIFY_BRANCH="$VERIFY_BRANCH" bash scripts/vps-verify-web-design.sh
            fi
        env:
          VERIFY_BRANCH: ${{ inputs.branch }}
