name: VPS Prod Hardcore QA

# Full production stabilization gate — same class as local QA campaign.
# Deploy + brain:sync + office probes + hallucination stress + MTProto E2E.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy and test on VPS"
        required: true
        default: "main"
        type: string

concurrency:
  group: vps-prod-hardcore-qa
  cancel-in-progress: false

jobs:
  hardcore-qa:
    name: Prod hardcore QA on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_TEAM_ID: ${{ secrets.SLACK_TEAM_ID }}
    steps:
      - name: Run hardcore QA on production VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "85m"
          script_stop: true
          envs: PROD_DOTENV,OPENROUTER_API_KEY,LINKEDIN_ACCESS_TOKEN,LINKEDIN_AUTHOR_URN,SLACK_BOT_TOKEN,SLACK_TEAM_ID,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos

            if [ -d .git/refs/heads/cursor ]; then rm -rf .git/refs/heads/cursor 2>/dev/null || true; fi
            find .git -name '*.lock' -delete 2>/dev/null || true

            git fetch --quiet origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd
            chmod +x scripts/apply-prod-env-overrides.sh scripts/vps-prod-hardcore-qa.sh 2>/dev/null || true
            bash scripts/apply-prod-env-overrides.sh
            DEPLOY_BRANCH="$DEPLOY_BRANCH" bash scripts/vps-prod-hardcore-qa.sh
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}

      - name: Upload QA artifacts summary
        if: always()
        run: |
          echo "## Prod Hardcore QA" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ inputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Check VPS /tmp/founderos-prod-qa/ for full logs." >> "$GITHUB_STEP_SUMMARY"
