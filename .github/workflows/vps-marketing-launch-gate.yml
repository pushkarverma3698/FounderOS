name: VPS Marketing Launch Gate

# Full marketing-campaign readiness check on production VPS.
# Deploy + brain + founder context + office probes + integrations + showcase.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy and verify on VPS"
        required: true
        default: "main"
        type: string

concurrency:
  group: vps-marketing-launch-gate
  cancel-in-progress: false

jobs:
  launch-gate:
    name: Marketing launch gate on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
    steps:
      - name: Run marketing launch gate on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "85m"
          script_stop: true
          envs: PROD_DOTENV,OPENROUTER_API_KEY,LINKEDIN_ACCESS_TOKEN,LINKEDIN_AUTHOR_URN,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos

            if [ -d .git/refs/heads/cursor ]; then rm -rf .git/refs/heads/cursor 2>/dev/null || true; fi
            find .git -name '*.lock' -delete 2>/dev/null || true

            git fetch --quiet origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd
            chmod +x scripts/apply-prod-env-overrides.sh scripts/vps-marketing-launch-gate.sh 2>/dev/null || true
            bash scripts/apply-prod-env-overrides.sh
            DEPLOY_BRANCH="$DEPLOY_BRANCH" bash scripts/vps-marketing-launch-gate.sh
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}

      - name: Upload launch gate summary
        if: always()
        run: |
          echo "## Marketing Launch Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ inputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "LinkedIn secrets: LINKEDIN_ACCESS_TOKEN + LINKEDIN_AUTHOR_URN (GitHub repo secrets)" >> "$GITHUB_STEP_SUMMARY"
          echo "Check VPS /tmp/founderos-launch-gate/ for full logs." >> "$GITHUB_STEP_SUMMARY"
