name: VPS Marketing Launch Gate

# Full marketing-campaign readiness check on production VPS.
# Deploy + brain + founder context + office probes + integrations + showcase.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch to deploy and verify on VPS"
        required: true
        default: "main"
        type: string

concurrency:
  group: vps-marketing-launch-gate
  cancel-in-progress: false

jobs:
  launch-gate:
    name: Marketing launch gate on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROD_DOTENV: ${{ secrets.PROD_DOTENV }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Run marketing launch gate on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "85m"
          script_stop: true
          envs: PROD_DOTENV,OPENROUTER_API_KEY,DEPLOY_BRANCH
          script: |
            set -euo pipefail
            export DEPLOY_BRANCH="${{ inputs.branch }}"
            cd /opt/founderos

            if [ -d .git/refs/heads/cursor ]; then rm -rf .git/refs/heads/cursor 2>/dev/null || true; fi
            find .git -name '*.lock' -delete 2>/dev/null || true

            if [ -n "${PROD_DOTENV:-}" ]; then
              umask 077
              printf '%s' "$PROD_DOTENV" | base64 -d > .env.tmp
              if grep -q '^DATABASE_URL=' .env.tmp; then
                mv .env.tmp .env
                chmod 600 .env
              else
                rm -f .env.tmp
                echo "!! PROD_DOTENV invalid" >&2
                exit 1
              fi
            fi
            if [ -n "${OPENROUTER_API_KEY:-}" ]; then
              grep -v -E '^(AGENT_MODEL|OPENROUTER_API_KEY|AGENT_FALLBACK_MODELS)=' .env > .env.patched || true
              {
                printf '%s\n' 'AGENT_MODEL=openrouter:google/gemini-2.5-flash'
                printf '%s\n' 'AGENT_FALLBACK_MODELS=anthropic:claude-haiku-4-5'
                printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
              } >> .env.patched
              mv .env.patched .env
              chmod 600 .env
            fi

            git fetch --quiet origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd
            chmod +x scripts/vps-marketing-launch-gate.sh 2>/dev/null || true
            DEPLOY_BRANCH="$DEPLOY_BRANCH" bash scripts/vps-marketing-launch-gate.sh
        env:
          DEPLOY_BRANCH: ${{ inputs.branch }}

      - name: Upload launch gate summary
        if: always()
        run: |
          echo "## Marketing Launch Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Branch: ${{ inputs.branch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Check VPS /tmp/founderos-launch-gate/ for full logs." >> "$GITHUB_STEP_SUMMARY"
