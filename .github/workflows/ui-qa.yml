# UI QA gate — renders the pages a client actually sees and blocks merge when
# they are broken. Contract: docs/antigravity/UI-QA-CONTRACT.md
#
# Why this is a separate workflow and not a step in ci.yml: it needs a Chromium
# download (~150MB) that every other job would pay for and never use, and it is
# path-filtered so it only runs when something renderable actually changed.
#
# COST: the deterministic pass makes no model call and needs NO secrets — not
# even DATABASE_URL. The vision pass runs only when the Gemini key is present
# and is capped at 8 images per run (MAX_VISION_IMAGES). When the key is absent
# the pack prints "vision: SKIPPED — no key" rather than rendering a clean pass.

name: UI QA

on:
  pull_request:
    paths:
      - "assets/cinematic-presets/**"
      - "apps/**"
      - "video-factory/projects/**"
      - "src/tools/browser/**"
      - "scripts/qa-ui.ts"
      - ".github/workflows/ui-qa.yml"
  push:
    branches: ["main", "beta"]
    paths:
      - "assets/cinematic-presets/**"
      - "apps/**"
      - "video-factory/projects/**"
      - "src/tools/browser/**"
      - "scripts/qa-ui.ts"

concurrency:
  group: ui-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ui-qa:
    name: UI QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      # --with-deps installs the system libraries headless Chromium needs on a
      # bare runner; without them the browser launches and immediately dies.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI QA
        id: qa
        continue-on-error: true
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
        run: |
          set -o pipefail
          FLAGS=""
          if [ -n "${GOOGLE_GENERATIVE_AI_API_KEY}" ]; then
            FLAGS="--vision"
            echo "Vision stage enabled."
          else
            echo "No GOOGLE_GENERATIVE_AI_API_KEY — deterministic checks only."
          fi
          pnpm qa:ui --out .artifacts/ui-qa ${FLAGS}

      # Uploaded even on failure: a red gate is exactly when someone wants the
      # screenshots, and `if: always()` is what makes them reachable.
      - name: Upload evidence pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-evidence-pack
          path: .artifacts/ui-qa
          retention-days: 14

      # One comment, updated in place. A new comment per push would bury the PR,
      # which is the same notification-storm failure the 2026-09-08 audit found
      # in pr-brain (1,590 repeats, 21% of the whole chat).
      - name: Post evidence pack to the PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.artifacts/ui-qa/report.md';
            if (!fs.existsSync(path)) {
              core.warning('No UI evidence pack was produced — qa:ui failed before writing one.');
              return;
            }
            const MARKER = '<!-- ui-qa-evidence-pack -->';
            let body = MARKER + '\n' + fs.readFileSync(path, 'utf8');
            // GitHub rejects a comment over 65536 chars.
            if (body.length > 60000) {
              body = body.slice(0, 60000) +
                '\n\n_…truncated. Full pack in the `ui-evidence-pack` build artifact._';
            }
            body += '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_';

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number },
            );
            const mine = existing.find((c) => c.body && c.body.includes(MARKER));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The gate. Runs last so the evidence is always published first. A crash
      # (report.json never written) and "the pack ran and found something
      # blocking" are different failure classes, so the message must not
      # claim defects were found when qa:ui never finished — that reads as
      # the evidence pack lying about what it checked.
      - name: Fail when the run was red
        if: steps.qa.outcome == 'failure'
        run: |
          if [ -f .artifacts/ui-qa/report.json ]; then
            echo "::error::UI QA found blocking defects — see the evidence pack comment or the ui-evidence-pack artifact."
          else
            echo "::error::qa:ui crashed before producing a report — see the 'Run UI QA' step log above, not the evidence pack (none was written)."
          fi
          exit 1
