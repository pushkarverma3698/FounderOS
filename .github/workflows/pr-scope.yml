name: PR scope

# A PR that adds a code or script file needs a `Checked first:` line (scripts/verify-pr-scope.ts).
# Separate from ci.yml because it must re-run when the PR body changes, which ci.yml does not.
# The job name keeps "(freeze + Moves)" because beta's branch protection requires that exact check;
# the freeze itself ended 2026-11-01.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: PR scope (freeze + Moves)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pr-scope
