name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    # NOTE: the `secrets` context is NOT allowed in job-level `if:` — using it
    # invalidates the whole workflow file (every job fails in 0s). Instead we
    # always start the job and skip the steps when the key is absent (env IS
    # allowed in step-level `if:`).
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Minimal env for config.ts validation
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      TELEGRAM_BOT_TOKEN: "ci:placeholder"
      TELEGRAM_CHAT_ID: "000000000"
    steps:
      - name: Note when skipped
        if: env.GOOGLE_GENERATIVE_AI_API_KEY == ''
        run: echo "GOOGLE_GENERATIVE_AI_API_KEY not set — skipping integration tests."
      - uses: actions/checkout@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
      - uses: pnpm/action-setup@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
      - run: pnpm test:integration
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''

  eval-and-update-readme:
    name: Eval + update README metrics
    runs-on: ubuntu-latest
    # Only on main. The `secrets` context is illegal in `if:`, so the key check
    # happens at the step level via env (see steps below).
    if: github.ref == 'refs/heads/main'
    needs: [quality, unit-tests]
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Note when skipped
        if: env.GOOGLE_GENERATIVE_AI_API_KEY == ''
        run: echo "GOOGLE_GENERATIVE_AI_API_KEY not set — skipping eval/readme update."
      - uses: actions/checkout@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
      - name: Run eval
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: pnpm eval
      - name: Update README metrics
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: pnpm update-readme-metrics
      - name: Commit updated metrics
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || \
            (git add EVAL.md README.md && \
             git commit -m "chore(eval): auto-update README metrics [skip ci]" && \
             git push)
