name: CI

# One real install (`gate`). Legacy job names below are thin pass-throughs so
# existing branch protection (2 required checks) keeps working without a GitHub
# settings change. When you update protection, require only `gate` and delete them.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - run: pnpm test:smoke

  # --- Legacy names for branch protection (no second install) ---
  quality:
    name: Type check + lint + wiring
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "Covered by gate job"

  unit-tests:
    name: Unit + regression tests
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - run: echo "Covered by gate job"
