name: CI

# SIMPLIFIED 2026-07-04: push runs only on main (post-merge); PRs are covered by
# the pull_request event alone. Previously push ran on "**" so every PR commit
# triggered the whole workflow TWICE (push + pull_request) — double the checks,
# double the queue time, zero added safety.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check + lint + wiring
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — verify:test-integrity diffs against origin/main, which
      # needs full history; the default shallow clone can't resolve it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Emit JS (dist/) — catches issues tsc --noEmit alone can miss. Must pass
      # before merge; deploy also runs build on the VPS (deploy/deploy.sh).
      - run: pnpm build:all
      # Compile/CI-time wiring integrity: a half-wired tool fails the build here
      # instead of silently doing nothing in production (keyless, stub env).
      - run: pnpm verify:wiring
      # CLAUDE.md rule #25: fails the build on tautological/self-serving test
      # patterns in changed test files (gamed tests should never reach prod).
      - run: pnpm verify:test-integrity

  unit-tests:
    name: Unit + regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Full deterministic suite (unit + regression) — the PR template's merge
      # gate. Previously CI ran only test:unit, so regression guards never gated.
      - run: pnpm test
      # Offline boot smoke — cleanly SKIPs without live env, FAILs on a fatal
      # misconfig. Never crashes the job.
      - run: pnpm test:smoke

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    # Main-only (post-merge): on PRs this job either silently skipped or spent
    # free-tier quota — either way it showed as a green check that proved
    # nothing, cluttering every PR. PR safety = quality + unit-tests (the two
    # required checks in branch protection).
    if: github.ref == 'refs/heads/main'
    # NOTE: the `secrets` context is NOT allowed in job-level `if:` — using it
    # invalidates the whole workflow file (every job fails in 0s). Instead we
    # always start the job and skip the steps when the key is absent (env IS
    # allowed in step-level `if:`).
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Minimal env for config.ts validation
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      TELEGRAM_BOT_TOKEN: "ci:placeholder"
      TELEGRAM_CHAT_ID: "000000000"
    steps:
      - name: Note when skipped
        if: env.GOOGLE_GENERATIVE_AI_API_KEY == ''
        run: echo "GOOGLE_GENERATIVE_AI_API_KEY not set — skipping integration tests."
      - uses: actions/checkout@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
      - uses: pnpm/action-setup@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
      - run: pnpm test:integration
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''

  eval-and-update-readme:
    name: Eval + update README metrics
    runs-on: ubuntu-latest
    # Only on main. The `secrets` context is illegal in `if:`, so the key check
    # happens at the step level via env (see steps below).
    if: github.ref == 'refs/heads/main'
    needs: [quality, unit-tests]
    env:
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Note when skipped
        if: env.GOOGLE_GENERATIVE_AI_API_KEY == ''
        run: echo "GOOGLE_GENERATIVE_AI_API_KEY not set — skipping eval/readme update."
      - uses: actions/checkout@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
      - name: Run eval
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: pnpm eval
      - name: Update README metrics
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: pnpm update-readme-metrics
      - name: Commit updated metrics
        if: env.GOOGLE_GENERATIVE_AI_API_KEY != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || \
            (git add EVAL.md README.md && \
             git commit -m "chore(eval): auto-update README metrics [skip ci]" && \
             git push)
