name: VPS Live Showcase

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy + verify showcase-1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Live showcase on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: "20m"
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/founderos
            git fetch --quiet origin main
            git reset --hard origin/main
            chmod +x scripts/vps-live-showcase.sh
            bash scripts/vps-live-showcase.sh 2>&1 | tee /tmp/vps-live-showcase.log
            tail -60 /tmp/vps-live-showcase.log
