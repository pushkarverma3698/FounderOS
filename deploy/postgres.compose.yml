# FounderOS — production Postgres (Docker), data-only.
# The APP does NOT run in Docker in production: the claude_code executor
# (src/tools/claude-code.ts) spawns the `claude` CLI from PATH and relies on the
# host's stored OAuth credentials, which are awkward to mount into a container.
# So: app under systemd on the host, Postgres here in Docker.
#
# Usage on the server:
#   docker compose -f deploy/postgres.compose.yml up -d
#
# Bound to 127.0.0.1 only — never expose Postgres to the public internet.
services:
  postgres:
    image: postgres:16-alpine
    container_name: founderos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: founderos
      # Override via shell env on the server: POSTGRES_PASSWORD=... docker compose up -d
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-founderos}
      POSTGRES_DB: founderos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - founderos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  founderos_pgdata:
